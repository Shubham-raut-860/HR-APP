services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: hr9-backend:latest
    env_file:
      - "./HR APP BACKEND/.env"
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379
      SKIP_STARTUP_MIGRATIONS: "false"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3

  harness-worker:
    image: hr9-backend:latest
    env_file:
      - "./HR APP BACKEND/.env"
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379
      SKIP_STARTUP_MIGRATIONS: "true"
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.services.harness_queue_worker"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  frontend:
    image: hr9-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  redis_data:
