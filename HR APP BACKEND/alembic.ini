# Alembic configuration file.

[alembic]
script_location = alembic
# Use async driver for SQLAlchemy (matches app/database.py)
# The actual URL is loaded from env vars via env.py — this is just a fallback.
sqlalchemy.url = sqlite+aiosqlite:///./hr_platform.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
